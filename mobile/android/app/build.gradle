apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "kotlin-android"

/**
 * HIRKANI Android Application
 * Production-ready build configuration
 */

react {
    /* Folders */
    root = file("../../")
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/@react-native/codegen")
    cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    debuggableVariants = ["liteDebug", "devDebug"]

    /* Bundling */
    bundleCommand = "ram-bundle"
    bundleConfig = file(file("../../metro.config.js"))
    bundleAssetName = "HirkaniApp.android.bundle"
    entryFile = file("../../index.js")
    extraPackagerArgs = []

    /* Hermes Commands */
    hermesCommand = "../../node_modules/react-native/sdks/hermesvm/%OS-BIN%/hermesc"
    debuggableVariants = []

    /* Code Pushing */
    codegenJavaPackageName = "com.hirkani"
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    namespace "com.hirkani"
    compileSdkVersion rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId "com.hirkani.pregnancy.food"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        // Enable multidex for apps with more than 64K methods
        multiDexEnabled true

        // Set app name
        resValue "string", "app_name", "HIRKANI"

        // Metadata
        manifestPlaceholders = [
            appAuthRedirectScheme: 'com.hirkani.pregnancy.food'
        ]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('HIRKANI_UPLOAD_STORE_FILE')) {
                storeFile file(HIRKANI_UPLOAD_STORE_FILE)
                storePassword HIRKANI_UPLOAD_STORE_PASSWORD
                keyAlias HIRKANI_UPLOAD_KEY_ALIAS
                keyPassword HIRKANI_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            // Enable R8 full mode
            android.enableR8.fullMode = true

            // Optimize APK size
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
        }
    }

    flavorDimensions "version"
    productFlavors {
        production {
            dimension "version"
            applicationIdSuffix ""
            versionNameSuffix ""
        }
        staging {
            dimension "version"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            resValue "string", "app_name", "HIRKANI Staging"
        }
    }

    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:flipper-integration")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // React Native dependencies
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

    // Camera (for barcode scanning)
    implementation project(':react-native-vision-camera')

    // Storage
    implementation project(':@react-native-async-storage_async-storage')

    // Security
    implementation project(':react-native-keychain')

    // Multidex support
    implementation 'androidx.multidex:multidex:2.0.1'
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
