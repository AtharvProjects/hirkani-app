<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #e0d4f5; font-family: sans-serif; display: flex; justify-content: center; height: 100vh; overflow: hidden;}
  .phone { width: 390px; height: 844px; background: white; position: relative; overflow-y: auto; overflow-x: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center;}
  .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; align-items: center; position: relative;}
  .bg-image {
    width: 100%; height: auto; z-index: 0; pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, black 0%, black 40%, transparent 42%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 0%, black 40%, transparent 42%, transparent 100%);
  }
  .card-wrap {
    position: relative; z-index: 10; width: 100%; padding: 0 20px; box-sizing: border-box;
    margin-top: -79%;
  }
  .card {
    width: 100%; max-width: 380px; margin: 0 auto;
    background: #FCF8FB; border-radius: 36px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.08);
    padding: 30px; box-sizing: border-box; text-align: center;
  }
</style>
</head>
<body>
  <div class="phone">
    <div style="position:fixed; inset:0; background: linear-gradient(to bottom, #D6C8F6, #F2D5EA, #EFE6F7); z-index: -1;"></div>
    
    <div class="container">
      <img class="bg-image" src="public/avatar_original.png" />
      <div class="card-wrap">
        <div class="card">
          <h1 style="color: #2E295E; margin-top: 20px;">Welcome Back!</h1>
          <p style="color: #8F8CAE;">Login to continue</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
